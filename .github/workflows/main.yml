name: Build TavernGamesVisual (Skyrim SE 1.6.1170)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build and Package Mod
        shell: pwsh
        run: |
          $cm = Get-ChildItem -Recurse -Filter "CMakeLists.txt" | Select-Object -First 1
          if (-not $cm) { throw "CMakeLists.txt не найден в репозитории!" }
          $root = $cm.Directory.FullName

          cmake -S "$root" -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $pkg = "dist/Data/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path "$pkg/TavernGamesVisual/textures" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/TavernGamesVisual/sounds" | Out-Null

          Copy-Item "build/Release/TavernGamesVisual.dll" "$pkg/TavernGamesVisual.dll"
          Copy-Item "$root/assets/TavernGamesVisual.ini" "$pkg/TavernGamesVisual.ini"
          Copy-Item "$root/assets/textures/*.png" "$pkg/TavernGamesVisual/textures/"
          Copy-Item "$root/assets/sounds/*.wav" "$pkg/TavernGamesVisual/sounds/"

          Compress-Archive -Path "dist/Data" -DestinationPath "TavernGamesVisual-SkyrimSE-1.6.1170.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TavernGamesVisual-SkyrimSE-1.6.1170
          path: TavernGamesVisual-SkyrimSE-1.6.1170.zip
